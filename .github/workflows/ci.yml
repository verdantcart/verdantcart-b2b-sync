name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite, pcntl, intl, zip, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

  tests:
    name: Tests · PHP ${{ matrix.php }} · ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        db: [sqlite]
        include:
          # Production database: catches what SQLite hides (jsonb, generated columns, locking).
          - php: '8.3'
            db: pgsql

    # Started for every job (a few seconds); only the pgsql job connects to it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: b2bsync_test
          POSTGRES_USER: b2bsync
          POSTGRES_PASSWORD: b2bsync_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U b2bsync -d b2bsync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ matrix.db == 'pgsql' && 'b2bsync_test' || ':memory:' }}
      DB_USERNAME: b2bsync
      DB_PASSWORD: b2bsync_test_password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_sqlite, pcntl, intl, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
