# Local dev services only. Laravel itself runs on the host (Laragon / `php artisan serve`).
services:
  postgres:
    image: postgres:16
    container_name: b2bsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: verdantcart_b2b_sync
      POSTGRES_USER: b2bsync
      POSTGRES_PASSWORD: b2bsync_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2bsync -d verdantcart_b2b_sync"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: b2bsync-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
