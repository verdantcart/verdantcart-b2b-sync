; Processes in the single demo container. All logs go to the container's stdout/stderr (fly logs).

[program:redis]
command=redis-server --port 6379 --bind 127.0.0.1 --save "" --appendonly no --maxmemory 48mb --maxmemory-policy noeviction
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:php-fpm]
command=php-fpm --nodaemonize
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:horizon]
command=php /var/www/html/artisan horizon
user=www-data
priority=40
autorestart=true
stopwaitsecs=70
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
